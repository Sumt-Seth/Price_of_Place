<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Price of Place</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a printed-deed look. Left = square game board with a roll panel in its centre; right = deed card, district mastery, log. */
:root{
  --bg:#e9ede7; --surface:#fafaf6; --surface2:#f0f2ec; --ink:#1b2420; --muted:#56635c; --line:#c9d0c6;
  --accent:#b1352c; --accent-ink:#ffffff; --good:#1f7a4d; --bad:#b1352c; --gold:#b58a12; --focus:#1c58d0;
  --board:#d4e3d3; --shadow:0 1px 0 rgba(0,0,0,.06),0 8px 24px rgba(20,35,28,.10);
  --f-display:'Archivo','Arial Narrow',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101613; --surface:#18211d; --surface2:#1f2a25; --ink:#e8efe9; --muted:#9baba3; --line:#33423b;
  --accent:#e0675d; --accent-ink:#1b0f0d; --good:#52c28a; --bad:#ec7f76; --gold:#e0b84a; --focus:#7aa2ff;
  --board:#16241d; --shadow:0 1px 0 rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101613; --surface:#18211d; --surface2:#1f2a25; --ink:#e8efe9; --muted:#9baba3; --line:#33423b;
  --accent:#e0675d; --accent-ink:#1b0f0d; --good:#52c28a; --bad:#ec7f76; --gold:#e0b84a; --focus:#7aa2ff;
  --board:#16241d; --shadow:0 1px 0 rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.app{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:16px 40px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-bottom:12px;border-bottom:3px double var(--ink)}
.brand h1{margin:0;font:800 clamp(26px,4.5vw,40px)/1 var(--f-display);letter-spacing:-.01em;text-transform:uppercase}
.brand p{margin:4px 0 0;color:var(--muted);font-size:14px}
.hud{display:flex;flex-wrap:wrap;gap:8px}
.stat{flex:1 1 76px;min-width:0;padding:6px 12px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.stat b{display:block;font:600 20px/1.2 var(--f-mono);font-variant-numeric:tabular-nums}
.stat span{white-space:nowrap;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.neg{color:var(--bad)}
nav.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-block:14px}
nav.tabs button{padding:8px 16px;border:1px solid var(--line);background:var(--surface);border-radius:6px;font:700 14px var(--f-display);letter-spacing:.04em;text-transform:uppercase}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
section.pane[hidden]{display:none}
.play{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:960px){.play{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.stat span{font-size:9.5px;letter-spacing:.03em}.stat b{font-size:16px}.hud{width:100%}.stat{padding:5px 8px}}
/* board */
.boardwrap{container-type:inline-size;max-width:760px;width:100%;margin-inline:auto}
.board{display:grid;grid-template:repeat(9,1fr)/repeat(9,1fr);aspect-ratio:1;background:var(--board);border:2px solid var(--ink);box-shadow:var(--shadow)}
.cell{position:relative;display:flex;flex-direction:column;justify-content:space-between;align-items:stretch;min-width:0;padding:0;margin:0;background:var(--surface);border:1px solid var(--ink);text-align:left;overflow:hidden}
.cell:hover{background:var(--surface2)}
.cell .band{height:22%;background:var(--c,transparent);border-bottom:1px solid var(--ink);flex:none}
.cell .id{font:800 max(10px,1.9cqw)/1 var(--f-display);padding:3px 4px 0}
.cell .nm{font-size:max(7px,1.2cqw);line-height:1.1;padding:0 4px;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;flex:1}
.cell .pips{display:flex;gap:2px;padding:0 4px 4px}
.cell .pips i{flex:1;height:4px;background:var(--line);max-width:14px}
.cell .pips i.on{background:var(--ink)}
.cell .pips i.on.h{background:var(--accent)}
.cell.corner,.cell.special{align-items:center;justify-content:center;text-align:center;font:800 max(9px,1.45cqw)/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;padding:3px;overflow-wrap:anywhere}
.cell small{display:block;margin-top:2px;font:500 max(7px,1.1cqw)/1.1 var(--f-body);text-transform:none;letter-spacing:0;color:var(--muted)}
.cell.here{outline:3px solid var(--accent);outline-offset:-3px;z-index:2}
.cell.sel{box-shadow:inset 0 0 0 3px var(--focus)}
.tok{position:absolute;right:4px;top:26%;width:max(14px,2.6cqw);height:max(14px,2.6cqw);border-radius:50%;background:var(--accent);border:2px solid var(--surface);box-shadow:0 0 0 2px var(--ink)}
.cell .ab{display:none}
@container (max-width:560px){.cell .nm{display:none}.cell .pips i{height:3px}.cell .pips{padding:0 2px 2px}.cell .id{padding:2px 2px 0;font-size:9px}.cell .full{display:none}.cell .ab{display:block;font:800 9px/1 var(--f-display)}.cell.corner,.cell.special{padding:1px}.tok{width:11px;height:11px;right:2px;top:30%}}
.center{grid-area:2/2/9/9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;text-align:center;overflow:hidden;min-width:0}
.center h2{margin:0;font:800 clamp(16px,3.6cqw,30px)/1 var(--f-display);text-transform:uppercase}
.center p{margin:0;font-size:clamp(11px,1.9cqw,15px);color:var(--muted);max-width:44ch}
.dice{display:flex;gap:10px}
.die{width:clamp(40px,7cqw,60px);height:clamp(40px,7cqw,60px);display:grid;place-items:center;background:var(--surface);border:2px solid var(--ink);border-radius:10px;font:800 clamp(20px,4cqw,32px) var(--f-display);box-shadow:var(--shadow)}
.btn{padding:10px 18px;border:2px solid var(--ink);background:var(--surface);border-radius:6px;font:800 14px var(--f-display);letter-spacing:.05em;text-transform:uppercase}
.btn:hover:not(:disabled){background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);background:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:6px 10px;font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.seg{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.seg button{padding:5px 10px;border:1px solid var(--ink);background:var(--surface);border-radius:999px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
/* side */
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;box-shadow:var(--shadow)}
.card h3{margin:0 0 8px;font:800 13px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.deed{border:2px solid var(--ink);background:var(--surface);padding:0;border-radius:2px}
.deed .dh{padding:8px 12px;border-bottom:2px solid var(--ink);border-top:12px solid var(--c);text-align:center}
.deed .dh small{display:block;font:700 11px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.deed .dh b{display:block;font:800 19px/1.15 var(--f-display);text-transform:uppercase}
.deed .db{padding:10px 14px;font-size:14.5px}
.deed .db h4{margin:10px 0 4px;font:800 11px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.deed .db p{margin:0 0 6px}
.deed .db ul{margin:0;padding-left:18px}
.deed .db li{margin-bottom:4px}
.deed .src{font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);margin-top:8px;padding-top:6px}
.mastery{display:grid;gap:6px}
.mrow{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;font-size:14px}
.mrow i{width:10px;height:10px;background:var(--c)}
.mrow .bar{display:flex;gap:2px}
.mrow .bar b{width:16px;height:8px;background:var(--line)}
.mrow .bar b.on{background:var(--ink)}
.mrow .bar b.h{background:var(--accent)}
.log{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:13.5px;max-height:240px;overflow:auto}
.log li{padding-left:8px;border-left:3px solid var(--line)}
.log li.good{border-color:var(--good)}.log li.bad{border-color:var(--bad)}
.hint{font-size:13px;color:var(--muted)}
/* dialog */
dialog{width:min(680px,calc(100vw - 24px));max-height:calc(100vh - 24px);padding:0;border:2px solid var(--ink);border-radius:8px;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,18,14,.6)}
.dlgin{padding:18px 20px 20px;display:grid;gap:12px}
.qhead{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;border-top:10px solid var(--c);padding-top:10px}
.chip{display:inline-block;padding:2px 10px;border:1px solid var(--ink);border-radius:999px;font:700 12px var(--f-display);letter-spacing:.05em;text-transform:uppercase}
.tier{font:600 12.5px var(--f-mono);color:var(--muted)}
.dlgin h2{margin:0;font:700 20px/1.3 var(--f-body)}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:11px 14px;border:2px solid var(--line);background:var(--surface2);border-radius:6px;line-height:1.35}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.opt:disabled{cursor:default}
.banner{padding:10px 14px;border-radius:6px;font-weight:700}
.banner.good{background:color-mix(in srgb,var(--good) 18%,var(--surface));border:1px solid var(--good)}
.banner.bad{background:color-mix(in srgb,var(--bad) 16%,var(--surface));border:1px solid var(--bad)}
.banner.neutral{background:var(--surface2);border:1px solid var(--line)}
textarea{width:100%;min-height:120px;padding:10px;border:2px solid var(--line);background:var(--surface2);border-radius:6px;resize:vertical}
.checks{display:grid;gap:6px}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface2)}
.checks input{margin-top:4px;width:18px;height:18px;flex:none}
.right-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}
/* other panes */
.pane h2.ph{margin:0 0 4px;font:800 24px var(--f-display);text-transform:uppercase}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-block:10px}
.tools input[type=search]{flex:1 1 220px;min-width:0;padding:9px 12px;border:2px solid var(--line);background:var(--surface);border-radius:6px}
details.dd{background:var(--surface);border:1px solid var(--line);border-left:10px solid var(--c);border-radius:4px;margin-bottom:8px}
details.dd summary{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:10px 12px;cursor:pointer;list-style:none}
details.dd summary::-webkit-details-marker{display:none}
details.dd summary b{font:800 15px var(--f-display);text-transform:uppercase}
details.dd summary span.dn{color:var(--muted);font-size:13px;flex:1 1 220px}
details.dd .deed{margin:0 12px 12px}
.eslist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-block:12px}
.eslist button{text-align:left;padding:12px;background:var(--surface);border:2px solid var(--line);border-radius:6px}
.eslist button[aria-pressed="true"]{border-color:var(--ink)}
.eslist button b{display:block;font:800 13px var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.eslist button span{font-size:13px;color:var(--muted)}
.mockq{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:10px}
.mockq .qn{font:600 12px var(--f-mono);color:var(--muted)}
.mockq label{display:flex;gap:10px;padding:6px 4px;align-items:flex-start;cursor:pointer}
.mockq label input{margin-top:4px;flex:none}
.mockq.ok{border-color:var(--good)}.mockq.no{border-color:var(--bad)}
.big{font:800 44px/1 var(--f-display)}
.sr{position:absolute;left:-9999px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head><body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Price of Place</h1>
      <p>SOCY/COMM 1511 midterm board game &middot; roll, land on a deed, answer to earn it.</p>
    </div>
    <div class="hud" id="hud" aria-live="polite"></div>
  </header>
  <nav class="tabs" role="tablist" aria-label="Game sections">
    <button role="tab" data-tab="play" aria-selected="true">Board</button>
    <button role="tab" data-tab="deeds" aria-selected="false">Deed Book</button>
    <button role="tab" data-tab="essays" aria-selected="false">Essay Locker</button>
    <button role="tab" data-tab="mock" aria-selected="false">Mock Midterm</button>
  </nav>
  <section class="pane" id="pane-play">
    <div class="play">
      <div class="boardwrap"><div class="board" id="board"></div></div>
      <aside class="side">
        <div class="card" id="deedcard"></div>
        <div class="card"><h3>District mastery</h3><div class="mastery" id="mastery"></div></div>
        <div class="card"><h3>Turn log</h3><ul class="log" id="log"></ul></div>
      </aside>
    </div>
  </section>
  <section class="pane" id="pane-deeds" hidden></section>
  <section class="pane" id="pane-essays" hidden></section>
  <section class="pane" id="pane-mock" hidden></section>
</div>
<dialog id="dlg" aria-modal="true"></dialog>
<script>
// ===== DATA PART 1: Districts A-B (Unit 1 foundations) =====
// mc(question, correct, [wrong x3], why)   ex(question, [key points])
const mc = (q, a, w, why) => ({ k: 'mc', q, a, w, why: why || '' });
const ex = (q, key) => ({ k: 'ex', q, key });

const D_A = {
  id: 'A', name: 'Sociology Basics', short: 'Sociology', color: '#8a5a3c', unit: 'Unit 1',
  props: [
    {
      id: 'A1', name: 'Discipline & Perspective', price: 60,
      deed: {
        def: 'A DISCIPLINE is a branch of learning or body of knowledge (engineering, psychology, computer science, criminal justice, dance, sociology). A DISCIPLINARY PERSPECTIVE is the specific lens used to study a topic; it relies on the unique theories, concepts, and rules of a single academic field. SOCIOLOGY is the systematic study of society, social behavior, and how social forces, institutions, and structures shape people’s lives.',
        ex: [
          'Obesity in the US (CDC maps, 1985–2020): a sociologist asks how rates differ by year, state, age, and race/ethnicity — not just “what did this person eat?”',
          'The “Interdisciplinary Response” slides: the same topic raises different questions in different disciplines.',
          'Sociology answers: what do sociologists do, and who or what do they study? (groups, institutions, patterns — not single individuals).'
        ],
        src: 'Sociology Basics slides (08-19). The definition of sociology itself was on an image slide — wording above is the standard one; check it against your notes.'
      },
      qs: [
        mc('In class, an academic “discipline” was described as:', 'A branch of learning or body of knowledge, such as engineering, psychology, or sociology', ['A set of penalties for breaking campus rules', 'One theory used to explain all human behavior', 'A professor’s job title'], 'Discipline = branch of learning / body of knowledge.'),
        mc('A “disciplinary perspective” is best described as:', 'A lens for studying a topic built on the theories, concepts, and rules of a single academic field', ['An individual’s personal opinion about a topic', 'A blend of every field’s methods into one approach', 'The list of majors a university offers'], 'The lens belongs to one field and relies on its unique theories and concepts.'),
        mc('A psychologist, an economist, and a sociologist all study rising obesity rates. Which research question is MOST characteristically sociological?', 'How do obesity rates differ across states, age groups, races/ethnicities, and years, and what social conditions explain the patterns?', ['Which brain chemicals make one person crave sugar?', 'How should one patient pick a diet plan this month?', 'How does one person’s weight change their personal sleep quality?'], 'Sociology looks at patterns across groups, places, and time and at the social forces behind them.'),
        ex('DESCRIBE sociology and EXPLAIN what the discipline contributes to what is known about our social world. Give an EXAMPLE of how a sociological interest in a social phenomenon differs from another discipline’s.', [
          'Sociology = systematic study of society, social behavior, and how social forces/institutions shape lives',
          'Contribution: reveals patterns and structures behind what looks like individual choice; asks “who benefits and who suffers?”',
          'A discipline gives a perspective/lens with its own theories and concepts',
          'Example: obesity — other fields focus on an individual’s body, diet, or choices; sociology maps patterns by time, place, age, race/ethnicity and social conditions'
        ])
      ]
    },
    {
      id: 'A2', name: 'Sociological Imagination', price: 60,
      deed: {
        def: 'C. Wright Mills (1959): the quality of mind that lets us see the link between individual experience (BIOGRAPHY) and the larger social and historical forces (HISTORY). Sociology lies at the intersection of history and biography. Its most useful distinction is between PERSONAL TROUBLES of milieu (private matters within a person’s immediate relations, where the person’s own values feel threatened) and PUBLIC ISSUES of social structure (matters that transcend local settings and involve institutions; publics feel a cherished value is threatened).',
        ex: [
          'Mills’s unemployment example: one man jobless in a city of 100,000 is a personal trouble; 15 million unemployed out of 50 million workers is a public issue — “the very structure of opportunities has collapsed.”',
          'Mills on marriage: a divorce rate of 250 per 1,000 first-four-year marriages signals a structural issue, not just individual troubles.',
          'Practice (slides): ask “who benefits and who suffers?”; notice how people are categorized (good/bad, deviant/“normal”); question assumptions that seem “natural.”',
          'Zinno’s “Beth”: she blames herself for being stuck at work when a glass ceiling may be the cause.'
        ],
        src: 'Mills, “The Promise” (1959); Sociology Basics slides; Zinno (Engaged Sociology, 2018).'
      },
      qs: [
        mc('What does it mean to say sociology lies at the intersection of history and biography?', 'Understanding a person’s life requires understanding the historical and social setting that shapes it, and vice versa', ['Sociologists should study only historical documents, not living people', 'Biographies of famous people are the main data for sociology', 'Individual lives and society are unrelated'], 'Mills: neither the life of an individual nor the history of a society can be understood without both.'),
        mc('“Connecting private troubles with public issues” means:', 'Seeing that problems people experience personally often reflect structural patterns affecting many people', ['Believing individuals have no responsibility for anything', 'Treating every problem as a flaw in personal character', 'Keeping personal life and public life completely separate'], ''),
        mc('A student cannot find an affordable apartment in Charlotte, and thousands of other residents report the same problem. Which response uses the sociological imagination?', 'Investigate how the housing market, wages, zoning, and policy create that pattern for many residents', ['Conclude she did not budget carefully enough', 'Assume rents are naturally high and nothing explains them', 'Focus only on her roommates’ habits'], 'When many people share the problem, it is a public issue with structural causes (Mills).'),
        ex('EXPLAIN the sociological imagination: what are “history” and “biography,” how do personal troubles differ from public issues, and how does it help us view society?', [
          'Mills: a quality of mind that connects individual experience to larger social forces',
          'Biography (individual life) and history (period/society) must be understood together',
          'Troubles = private, within immediate milieu; issues = public, structural, institutional',
          'Example: 1 unemployed man vs. 15 million unemployed (or housing affordability)',
          'Habits: ask who benefits/suffers, how people are categorized, question “natural” assumptions'
        ])
      ]
    },
    {
      id: 'A3', name: 'Individual vs. Structural Thinking', price: 80,
      deed: {
        def: 'The INDIVIDUALISTIC perspective explains outcomes by personal choices, traits, and effort. The SOCIOLOGICAL (structural) perspective explains them by social structure — patterns of relationships, institutions, and unequal access to resources. Terms: SOCIETY = people sharing a territory and culture; SOCIAL INSTITUTION = an established set of norms organized around a basic social need (family, education, economy, government, religion); SOCIAL STRUCTURE = the patterned arrangements and relationships that organize society; SOCIAL CONSTRUCT = an idea or category that exists because society collectively treats it as real, not because it is natural.',
        ex: [
          'Obesity from an individualist perspective = willpower, diet, exercise; from a sociological perspective = trends by year, state, age, and race/ethnicity (CDC maps).',
          'The American Dream’s hidden message — “if I fail, it is 100% my fault” — is individualistic; structural barriers (class, race, gender) are left out.',
          '“Thinking structurally”: asking what institutions, policies, and unequal resources produce an outcome.'
        ],
        src: 'Sociology Basics slides; Zinno (2018). Definitions of society / institution / structure / construct are the standard textbook ones — the slide versions were on images.'
      },
      qs: [
        mc('Which statement reflects an INDIVIDUALISTIC perspective on obesity?', 'People are overweight because they lack willpower and make poor food choices', ['Obesity rates differ sharply by state, age, and race/ethnicity', 'Access to affordable healthy food varies with income and neighborhood', 'National obesity maps changed dramatically between 1990 and 2010'], 'Individualism blames personal traits and choices.'),
        mc('A “social construct” is:', 'An idea or category that exists because society collectively treats it as real', ['A building planned by city engineers', 'A natural fact identical in every society', 'An opinion held by a single person'], ''),
        mc('A news segment says recent graduates are unemployed because “young people are lazy.” Which reframing THINKS STRUCTURALLY?', 'Look at hiring patterns, regional job markets, student debt, and which industries are growing', ['Ask each graduate to rate their own motivation', 'Compare graduates’ personalities', 'Assume the labor market always rewards effort fairly'], 'Structural thinking examines institutions and conditions, not just individuals.'),
        ex('COMPARE an individualistic and a sociological perspective on a social problem (e.g., obesity or the American Dream). Give examples of thinking structurally.', [
          'Individualistic: personal choices, effort, character',
          'Sociological: social structure, institutions, patterns across groups/places/time',
          'Example: obesity maps by state/age/race, not just willpower',
          'Key terms: society, social institution, social structure, social construct',
          'Structural thinking questions “natural” assumptions and asks who benefits/suffers'
        ])
      ]
    }
  ]

function stakeText(s){ return 'Right: ' + s.win + ' · Wrong: ' + s.lose; }
function ask(o){

      $$('input[type=checkbox]', dlg).forEach(cb => cb.onchange = () => { $('#cnt').textContent = $$('input:checked', dlg).length + ' of ' + q.key.length + ' covered'; });
      $('#score').onclick = () => {
        const n = $$('input:checked', dlg).length, r = n / q.key.length;

}
function chooseQ(id, level){
  const p = PROPS[id].p;
  if (level === 0) { // tier-1: least-asked of the two recall questions, prefer unanswered-correctly
    const c = [0, 1].sort((a, b) => ((G.correct[id + ':' + a] ? 1 : 0) - (G.correct[id + ':' + b] ? 1 : 0)) || ((G.asked[id + ':' + a] || 0) - (G.asked[id + ':' + b] || 0)) || (Math.random() - .5));
    return c[0];
  }
  if (level === 1) return 2;
  if (level === 2) return 3;
  return pick([0, 1, 2]);
}
function markAsked(id, qi, kind){
  const k = id + ':' + qi;
  G.asked[k] = (G.asked[k] || 0) + 1;
  if (kind === 'ok') { G.correct[k] = true; G.right++; G.missed = G.missed.filter(x => x !== k); }
  else if (kind === 'miss') { G.wrong++; if (!G.missed.includes(k)) G.missed.push(k); }
  else { G.right++; }
}
function checkSets(){
  DISTRICTS.forEach(d => {
    if (!G.setBonus[d.id] && d.props.every(p => lvlOf(p.id) >= 1)) {
      G.setBonus[d.id] = true; G.passes++;
      log('Monopoly! You hold every deed in ' + d.name + '. District rent doubles and you earn a Transfer Pass.', 'good');
    }
  });
}
function landProperty(id){

function doReview(id, qi){

async function land(){
  const t = LAYOUT[G.pos]; renderAll();
  if (PROPS[t]) landProperty(t);
  else if (t === 'CH') landChance();
  else if (t === 'CC') landChest();
  else if (t === 'PARK') landPark();
  else if (t === 'JAIL') reviewMissed(false);
  else if (t === 'GOTO') { log('Go to Review! Sent to Review Jail.', 'bad'); renderSide(); await sleep(reduce() ? 0 : 450); G.pos = 8; renderAll(); reviewMissed(true); }
  else { endTurn(); } // GO

function passGo(){
  G.lap++;

  addCash(200 + rent);
  log('Passed Go (lap ' + G.lap + '): +$200' + (rent ? ' + ' + money(rent) + ' rent' : '') + '.', 'good');
  if (G.laps && G.lap >= G.laps) G.final = true;
}
async function move(n){
  for (let i = 0; i < n; i++) {
    G.pos = (G.pos + 1) % 32;
    if (G.pos === 0) passGo();
    renderBoard(); renderHud();
    await sleep(reduce() ? 0 : 120);

}

    '<div class="right-actions"><span></span><button class="btn" id="cancel">Cancel</button></div>', false);
  $('#cancel').onclick = closeDlg;
  $$('[data-go]', dlg).forEach(b => b.onclick = () => { G.passes--; G.pos = LAYOUT.indexOf(b.dataset.go); busy = true; log('Transfer Pass used: moved to ' + PROPS[b.dataset.go].p.name + '.', ''); closeDlg(); land(); });
}
function title(m){ return m < .2 ? 'Renter' : m < .4 ? 'Homeowner' : m < .6 ? 'Landlord' : m < .85 ? 'Developer' : 'Monopolist of Place'; }
function finish(){
  G.over = true; save();
  const m = mastery();
  const weak = DISTRICTS.map(d => ({ d, s: d.props.reduce((s, p) => s + lvlOf(p.id), 0) })).sort((a, b) => a.s - b.s).slice(0, 2).filter(x => x.s < 9);
  openDlg('<div class="qhead" style="--c:var(--accent)"><span class="chip">Game over</span><span class="tier">' + G.lap + ' laps · ' + G.turn + ' turns</span></div><div class="big">' + esc(title(m)) + '</div><p style="margin:0">Net worth <b>' + money(worth()) + '</b> (cash ' + money(G.cash) + '). Mastery <b>' + Math.round(m * 100) + '%</b>. Accuracy <b>' + (G.right + G.wrong ? Math.round(100 * G.right / (G.right + G.wrong)) : 0) + '%</b>.</p>' +
    (weak.length ? '<p style="margin:0"><b>Study next:</b> ' + weak.map(x => esc(x.d.name)).join(' and ') + '.</p>' : '<p style="margin:0">Every district is fully developed.</p>') +
    (G.missed.length ? '<p style="margin:0"><b>' + G.missed.length + '</b> questions are still on your review list: ' + G.missed.slice(0, 8).map(k => esc(PROPS[k.split(':')[0]].p.name)).filter((v, i, a) => a.indexOf(v) === i).join(', ') + '.</p>' : '') +
    '<div class="right-actions"><button class="btn" id="toDeeds">Open Deed Book</button><button class="btn primary" id="again">Play again</button></div>', false);
  $('#again').onclick = () => { closeDlg(); G = newGame(G.laps); selected = null; save(); renderAll(); };
  $('#toDeeds').onclick = () => { closeDlg(); showTab('deeds'); };
  renderAll();
}

/* ---------- board events ---------- */
$('#board').addEventListener('click', e => {
  const cell = e.target.closest('.cell'); if (cell) { selected = +cell.dataset.i; renderBoard(); renderSide(); return; }
  if (e.target.id === 'startBtn') { const laps = G.laps; G = newGame(laps); G.started = true; log('New game. Roll to begin.', ''); selected = null; save(); renderAll(); return; }
  if (e.target.dataset.laps) { G.laps = +e.target.dataset.laps; renderCenter(); return; }
  if (e.target.id === 'rollBtn') roll();
  else if (e.target.id === 'passBtn') usePass();
  else if (e.target.id === 'endBtn') { G.final = true; finish(); }
});

/* ---------- tabs ---------- */
function showTab(name){
  $$('nav.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === name)));
  ['play', 'deeds', 'essays', 'mock'].forEach(n => { $('#pane-' + n).hidden = n !== name; });
  if (name === 'deeds') renderDeeds();
  if (name === 'essays') renderEssays();
  if (name === 'mock') renderMock();
  if (name === 'play') renderAll();
}
$$('nav.tabs button').forEach(b => b.onclick = () => showTab(b.dataset.tab));

/* ---------- Deed Book ---------- */
let deedFilter = 'ALL', deedQuery = '', deedOpen = null;
function renderDeeds(){
  const pane = $('#pane-deeds');
  if (!pane.dataset.built) {
    pane.dataset.built = '1';
    pane.innerHTML = '<h2 class="ph">Deed Book</h2><p class="hint" style="margin:0">Every definition and example the game draws on, grouped by district. Search any term.</p><div class="tools"><input type="search" id="dq" placeholder="Search terms, names, numbers (e.g. kairos, Gini, HOLC)" aria-label="Search deeds"></div><div class="seg" id="dseg"></div><div id="dlist" style="margin-top:12px"></div>';
    $('#dq').oninput = e => { deedQuery = e.target.value.toLowerCase(); drawDeeds(); };
    $('#dseg').onclick = e => { if (e.target.dataset.f) { deedFilter = e.target.dataset.f; drawDeeds(); } };
  }
  drawDeeds();
}
function drawDeeds(){
  $('#dseg').innerHTML = '<button data-f="ALL" aria-pressed="' + (deedFilter === 'ALL') + '">All</button>' + DISTRICTS.map(d => '<button data-f="' + d.id + '" aria-pressed="' + (deedFilter === d.id) + '">' + esc(d.short) + '</button>').join('');
  const q = deedQuery;
  $('#dq').value = deedQuery;
  let n = 0;
  $('#dlist').innerHTML = DISTRICTS.filter(d => deedFilter === 'ALL' || d.id === deedFilter).map(d => d.props.filter(p => {
    if (!q) return true;
    return (p.id + ' ' + p.name + ' ' + p.deed.def + ' ' + p.deed.ex.join(' ') + ' ' + p.deed.src).toLowerCase().includes(q);
  }).map(p => { n++; return '<details class="dd" style="--c:' + d.color + '"' + (deedOpen === p.id || (q && n <= 3) ? ' open' : '') + '><summary><b>' + esc(p.id + ' · ' + p.name) + '</b><span class="dn">' + esc(d.name) + '</span>' + pips(p.id) + '</summary>' + deedHTML(p.id) + '</details>'; }).join('')).join('') || '';
  if (!n) $('#dlist').innerHTML = '<p class="hint">No deeds match "' + esc(q) + '".</p>';
}
function openDeed(id){ deedFilter = 'ALL'; deedQuery = ''; deedOpen = id; showTab('deeds'); const el = $$('#dlist details').find(x => x.open); if (el) el.scrollIntoView({ block:'start' }); }

/* ---------- Essay Locker ---------- */
let essaySel = 1;
function renderEssays(){
  const pane = $('#pane-essays');
  const e = ESSAYS.find(x => x.id === essaySel);
  pane.innerHTML = '<h2 class="ph">Essay Locker</h2><p class="hint" style="margin:0">Four of these eight prompts will be on the exam (40 points). Practice one, then check yourself against the key points. Your drafts stay in this browser.</p>' +
    '<div class="eslist">' + ESSAYS.map(x => '<button data-e="' + x.id + '" aria-pressed="' + (x.id === essaySel) + '"><b>' + x.id + '. ' + esc(x.topic) + '</b><span>' + (store.essays[x.id] ? 'Best self-score: ' + Math.round(store.essays[x.id].best * 100) + '%' : 'Not practiced yet') + '</span></button>').join('') + '</div>' +
    '<div class="card"><h3>Prompt ' + e.id + '</h3><p style="margin:0 0 10px;font-size:17px">' + esc(e.prompt) + '</p><label class="hint" for="essayTa">Your answer</label><textarea id="essayTa" style="min-height:180px">' + esc(store.drafts[e.id] || '') + '</textarea>' +
    '<div class="right-actions" style="margin-top:10px"><span class="hint">Deeds to review: ' + ESSAY_DEEDS[e.id].map(id => '<button class="btn small" data-deed="' + id + '">' + id + ' ' + esc(PROPS[id].p.name) + '</button>').join(' ') + '</span><button class="btn primary" id="essayReveal">Show key points</button></div><div id="essayKeys" style="margin-top:12px"></div></div>';
  $('.eslist', pane).onclick = ev => { const b = ev.target.closest('button'); if (b) { essaySel = +b.dataset.e; renderEssays(); } };
  $('#essayTa').oninput = ev => { store.drafts[e.id] = ev.target.value; try { localStorage.setItem(KEY, JSON.stringify(Object.assign({}, store, { game: G }))); } catch(x){} };
  $$('[data-deed]', pane).forEach(b => b.onclick = () => openDeed(b.dataset.deed));
  $('#essayReveal').onclick = () => {
    $('#essayKeys').innerHTML = '<div class="checks">' + e.key.map(k => '<label><input type="checkbox"><span>' + esc(k) + '</span></label>').join('') + '</div><div class="right-actions" style="margin-top:10px"><span class="hint" id="ecnt">0 of ' + e.key.length + ' covered</span><button class="btn" id="esave">Save self-score</button></div>';
    $$('#essayKeys input').forEach(cb => cb.onchange = () => { $('#ecnt').textContent = $$('#essayKeys input:checked').length + ' of ' + e.key.length + ' covered'; });
    $('#esave').onclick = () => { const r = $$('#essayKeys input:checked').length / e.key.length; store.essays[e.id] = { best: Math.max(r, (store.essays[e.id] && store.essays[e.id].best) || 0) }; save(); renderEssays(); };
  };
}

/* ---------- Mock Midterm ---------- */
let mock = null;
function buildMock(){
  const pool = {};
  DISTRICTS.forEach(d => { pool[d.id] = []; d.props.forEach(p => p.qs.forEach((q, qi) => { if (q.k === 'mc') pool[d.id].push({ id:p.id, qi, q, dist:d.id }); })); });
  let chosen = [], rest = [];
  DISTRICTS.forEach(d => { const s = shuffle(pool[d.id]); chosen = chosen.concat(s.slice(0, 4)); rest = rest.concat(s.slice(4)); });
  chosen = chosen.concat(shuffle(rest).slice(0, 2));
  chosen = shuffle(chosen).map(x => Object.assign({ opts: shuffle([{ t:x.q.a, c:true }].concat(x.q.w.map(t => ({ t, c:false })))) }, x));
  return { qs: chosen, essays: shuffle(ESSAYS).slice(0, 4), phase: 'mc', mcScore: 0, start: Date.now() };
}
function renderMock(){
  const pane = $('#pane-mock');
  if (!mock) {
    pane.innerHTML = '<h2 class="ph">Mock Midterm</h2><p class="hint" style="margin:0 0 12px">Built like the real exam: 30 multiple-choice questions (60 points) and 4 of the 8 essay prompts (40 points). Questions come from every district.</p>' + (store.mockBest != null ? '<p>Best score so far: <b>' + store.mockBest + ' / 100</b></p>' : '') + '<button class="btn primary" id="mockStart">Start the exam</button>';
    $('#mockStart').onclick = () => { mock = buildMock(); renderMock(); };
    return;
  }
  if (mock.phase === 'mc') {
    pane.innerHTML = '<h2 class="ph">Part 1 · Multiple choice</h2><p class="hint" style="margin:0 0 12px">2 points each. Answer all 30, then submit.</p>' + mock.qs.map((x, i) => '<div class="mockq" data-i="' + i + '"><div class="qn">Question ' + (i + 1) + ' of ' + mock.qs.length + '</div><p style="margin:2px 0 6px;font-weight:700">' + esc(x.q.q) + '</p>' + x.opts.map((o, j) => '<label><input type="radio" name="q' + i + '" value="' + j + '"><span>' + esc(o.t) + '</span></label>').join('') + '<div class="why hint" hidden></div></div>').join('') + '<div class="right-actions"><span class="hint" id="mcount">0 of ' + mock.qs.length + ' answered</span><button class="btn primary" id="mcSubmit">Submit part 1</button></div>';
    pane.oninput = () => { $('#mcount') && ($('#mcount').textContent = $$('#pane-mock input:checked').length + ' of ' + mock.qs.length + ' answered'); };
    $('#mcSubmit').onclick = () => {
      let score = 0; const weak = {};
      mock.qs.forEach((x, i) => {
        const sel = $('input[name="q' + i + '"]:checked'); const box = $('.mockq[data-i="' + i + '"]');
        const ok = sel && x.opts[+sel.value].c;
        if (ok) score++; else weak[x.id] = true;
        box.classList.add(ok ? 'ok' : 'no');
        $$('input', box).forEach(r => r.disabled = true);
        const w = $('.why', box); w.hidden = false; w.innerHTML = (ok ? 'Correct.' : 'Answer: <b>' + esc(x.q.a) + '</b>') + ' <em>(' + esc(PROPS[x.id].p.name) + ')</em>';
      });
      mock.mcScore = score; mock.weak = Object.keys(weak);
      $('#mcSubmit').disabled = true;
      const next = document.createElement('div'); next.className = 'card'; next.style.marginTop = '12px';
      next.innerHTML = '<p style="margin:0"><b>' + score + ' / ' + mock.qs.length + ' correct = ' + score * 2 + ' / 60 points.</b> ' + (mock.weak.length ? 'Review: ' + mock.weak.filter((v, i, a) => a.indexOf(v) === i).map(id => '<button class="btn small" data-deed="' + id + '">' + id + ' ' + esc(PROPS[id].p.name) + '</button>').join(' ') : 'No misses.') + '</p><div class="right-actions" style="margin-top:12px"><span></span><button class="btn primary" id="toEssays">Continue to part 2</button></div>';
      $('#pane-mock').appendChild(next);
      $$('[data-deed]', next).forEach(b => b.onclick = () => openDeed(b.dataset.deed));
      $('#toEssays').onclick = () => { mock.phase = 'essay'; renderMock(); window.scrollTo(0, 0); };
      next.scrollIntoView({ block: 'center' });
    };
  } else if (mock.phase === 'essay') {
    pane.oninput = null;
    pane.innerHTML = '<h2 class="ph">Part 2 · Short essays</h2><p class="hint" style="margin:0 0 12px">10 points each. Write each answer, then tick the key points you covered.</p>' + mock.essays.map((e, i) => '<div class="card" style="margin-bottom:12px" data-e="' + i + '"><h3>Essay ' + (i + 1) + ' · ' + esc(e.topic) + '</h3><p style="margin:0 0 8px;font-size:16px">' + esc(e.prompt) + '</p><textarea aria-label="Answer to essay ' + (i + 1) + '"></textarea><div class="checks" style="margin-top:8px" hidden>' + e.key.map(k => '<label><input type="checkbox"><span>' + esc(k) + '</span></label>').join('') + '</div><div class="right-actions" style="margin-top:8px"><span></span><button class="btn small reveal">Show key points</button></div></div>').join('') + '<div class="right-actions"><span></span><button class="btn primary" id="finishExam">Finish exam</button></div>';
    $$('.reveal', pane).forEach(b => b.onclick = () => { b.closest('.card').querySelector('.checks').hidden = false; b.disabled = true; });
    $('#finishExam').onclick = () => {
      let pts = 0;
      $$('[data-e]', pane).forEach(card => { const boxes = $$('input', card); pts += 10 * (boxes.filter(x => x.checked).length / boxes.length); });
      pts = Math.round(pts * 2) / 2; mock.essayScore = pts; mock.phase = 'done'; mock.total = mock.mcScore * 2 + pts;
      if (store.mockBest == null || mock.total > store.mockBest) store.mockBest = mock.total; save();
      renderMock();
    };
  } else {
    const t = mock.total, grade = t >= 90 ? 'A range' : t >= 80 ? 'B range' : t >= 70 ? 'C range' : 'Keep studying';
    pane.innerHTML = '<h2 class="ph">Results</h2><div class="card"><div class="big">' + t + ' / 100</div><p style="margin:6px 0 0">' + grade + '. Multiple choice ' + mock.mcScore * 2 + ' / 60 · essays ' + mock.essayScore + ' / 40 (self-scored).</p>' + (mock.weak && mock.weak.length ? '<p>Deeds to revisit: ' + mock.weak.filter((v, i, a) => a.indexOf(v) === i).map(id => '<button class="btn small" data-deed="' + id + '">' + id + ' ' + esc(PROPS[id].p.name) + '</button>').join(' ') + '</p>' : '') + '<div class="row" style="justify-content:flex-start;margin-top:10px"><button class="btn primary" id="again2">Take another mock</button></div></div>';
    $$('[data-deed]', pane).forEach(b => b.onclick = () => openDeed(b.dataset.deed));
    $('#again2').onclick = () => { mock = null; renderMock(); };
  }
}

/* ---------- boot ---------- */
if (G.started && !G.over && LAYOUT[G.pos]) { /* resumed game */ }
renderAll();
window.__pop = { get G(){ return G; }, roll, land, PROPS, DISTRICTS, ESSAYS, CHEST, LAYOUT };
})();
</script></body></html>
